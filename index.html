<!DOCTYPE html>
<!--
  index.html — Halaman profil (link-in-bio) Natan
  ------------------------------------------------
  Struktur halaman:
  1. Avatar (foto profil, otomatis dari Discord via script.js)
  2. Nama (otomatis dari display name Discord)
  3. Kartu server Discord (nama server, jumlah member, tombol Join)
  4. Ikon social links (GitHub, Discord, Instagram, Portofolio)

  Sebagian besar konfigurasi (ID Discord, invite server, ukuran
  avatar, dll) ada di script.js bagian CONFIG & PERSON_INFO.
  Untuk ganti link social media, edit langsung atribut href pada
  tag-tag <a> di bagian "Social links" di bawah.
-->
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natan</title>
<meta name="description" content="Natan bio link">
<meta name="keywords" content="Natan, bio link, personal website, discord">
<meta name="author" content="Natan">

<!-- Open Graph -->
<meta property="og:title" content="Natan Alfarizqi">
<meta property="og:description" content="Natan bio link">
<meta property="og:url" content="https://cxvu.my.id">
<meta property="og:site_name" content="Natan">
<meta property="og:locale" content="en_US">
<meta property="og:type" content="website">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Natan — Bio Link">
<meta name="twitter:description" content="Natans personal bio link">
<meta name="twitter:creator" content="@natanzqi">

<link rel="icon" href="img/favicon.ico">
<link rel="apple-touch-icon" href="img/favicon.ico">

<!-- Preconnect ke domain API eksternal, supaya koneksi (DNS + TLS)
     sudah siap lebih awal sebelum fetch() dijalankan di script.js.
     Ini bikin data Discord (avatar, nama, server) muncul lebih cepat. -->
<link rel="preconnect" href="https://api.lanyard.rest">
<link rel="preconnect" href="https://discord.com">
<link rel="preconnect" href="https://cdn.discordapp.com">

<!-- Dark mode secepat mungkin, sebelum halaman terlihat, biar tidak "kedip" -->
<script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (err) {}
  })();
</script>

<link rel="stylesheet" href="style.css">
</head>
